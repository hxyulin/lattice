[package]
name = "lattice"
version = "0.0.0"
authors = ["hxyulin <hxyulin@proton.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hxyulin/lattice"

[features]
profiling = []

[dependencies]
nonmax = "0.5"

[[bin]]
name = "lattice"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"

[profile.dev.package.lattice]
opt-level = 2
