# Configuration for the typos spell checker (https://github.com/crate-ci/typos).
# Run with `typos` (install: `cargo install typos-cli`).

[files]
# bench.csv is generated from commit trailers: its first column is abbreviated
# hashes, and hex digits spell words often enough that a regenerated ledger can
# fail the hook on a SHA nobody chose.
extend-exclude = ["Cargo.lock", "bench.csv"]

[default]
# Add false positives here when typos flags a chess term it should not, e.g.
# a FEN fragment or an identifier:
#   extend-ignore-identifiers-re = ["..."]
# or a specific word:
#   [default.extend-words]
#   "wQ" = "wQ"
