name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Keep this version in sync with the typos hook in .pre-commit-config.yaml.
      - uses: crate-ci/typos@v1.47.2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The shipped-depth bench test is release-only: it self-skips in debug,
      # so without this step nothing would run it.
      - run: cargo test --release
